<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#070b14" />
  <title>좀비 보카 (Zombie Voca)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    /* 전역 스크롤바 시각적 숨김 (마우스 휠 및 터치 스크롤 정상 유지) */
    *,
    #lobby-content,
    #modal-card {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar,
    #lobby-content::-webkit-scrollbar,
    #modal-card::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body class="bg-[#e6dec8] text-[#1f2d24] flex items-center justify-center min-h-[100dvh] overflow-hidden">
  <!-- 9:16 모바일 세로 고정 뷰포트 (최대 480px) -->
  <div id="app-shell" class="relative w-full max-w-[480px] h-[100dvh] max-h-[920px] bg-[#efe9dc] overflow-hidden shadow-2xl border-x border-[#d2c8b4] flex flex-col">

    <!-- 1 & 2. 인게임 전투 Full 레이어 (PLAYING / PAUSED / BOSS 상태) -->
    <div id="hud-layer" class="hidden absolute inset-0 w-full h-full overflow-hidden z-20">
      <!-- 풀스크린 게임 캔버스 & 화살표 인디케이터 뷰포트 (화면 100% 채움) -->
      <div id="battle-viewport" class="absolute inset-0 w-full h-full overflow-hidden">
        <canvas id="game-canvas" class="absolute inset-0 w-full h-full block"></canvas>

        <!-- 상단 엣지 다크 페이드 비네팅 (전광판 위쪽 틈새 자연스러운 마감) -->
        <div class="absolute top-0 inset-x-0 h-16 pointer-events-none bg-gradient-to-b from-[#0a1811]/90 via-[#0a1811]/45 to-transparent z-10"></div>

        <!-- 4방향 네온 화살표 인디케이터 컨테이너 -->
        <div id="edge-arrows" class="absolute inset-0 pointer-events-none"></div>

        <!-- 오답 확인 브레이크 중앙 카드 오버레이 (1.2초) -->
        <div id="wrong-review-overlay" class="hidden absolute inset-0 z-30 bg-[#0a1811]/70 backdrop-blur-[2px] flex items-center justify-center p-5 pointer-events-none">
          <div class="w-full max-w-[290px] rounded-2xl bg-[#11261b]/95 border-2 border-amber-400/80 px-6 py-4 text-center shadow-[0_0_32px_rgba(245,158,11,0.45)] flex flex-col items-center justify-center">
            <div id="wrong-review-word" class="text-xl font-bold text-emerald-200/90 tracking-wider"></div>
            <div id="wrong-review-meaning" class="text-3xl sm:text-4xl font-extrabold text-amber-300 drop-shadow-[0_0_16px_rgba(251,191,36,0.65)] mt-1.5 leading-tight tracking-tight"></div>
          </div>
        </div>

        <!-- 플로팅 가상 조이스틱 (터치 시 동적 위치 이동) -->
        <div id="virtual-joystick" class="hidden fixed pointer-events-none z-30">
          <div id="joystick-base" class="w-24 h-24 rounded-full border-2 border-emerald-400/50 bg-emerald-500/10 backdrop-blur-[1px] flex items-center justify-center">
            <div id="joystick-knob" class="w-10 h-10 rounded-full bg-emerald-300/80 shadow-[0_0_12px_rgba(52,211,153,0.8)]"></div>
          </div>
        </div>
      </div>

      <!-- 상단 플로팅 오버레이: 단일 네온 LED 전광판 HUD (z-20) -->
      <div id="hud-top-frame" class="absolute top-1.5 inset-x-3 z-20 space-y-1.5 pointer-events-none pt-[env(safe-area-inset-top)]">
        <!-- 월반 테스트 상태 배지 (기본 숨김) -->
        <div id="hud-placement-badge" class="hidden pointer-events-auto mx-auto w-fit px-3.5 py-1 rounded-full bg-slate-950/95 border-2 border-indigo-500/80 text-white font-black text-xs shadow-[0_0_14px_rgba(99,102,241,0.5)] flex items-center justify-center gap-1.5">
          <span id="hud-placement-text">🎓 STAGE 월반 도전 · ❤️❤️❤️ (남은 기회 3회)</span>
        </div>

        <!-- 보스 체력 바 (28~30번 문제 전용, 기본 숨김) -->
        <div id="hud-boss-bar-wrap" class="hidden pointer-events-auto bg-slate-950/95 border-2 border-rose-500/80 rounded-xl px-3 py-1.5 backdrop-blur-sm shadow-[0_0_14px_rgba(244,63,94,0.4)]">
          <div class="flex items-center justify-between text-[11px] font-bold text-rose-300 mb-1">
            <span id="hud-boss-name">BOSS</span>
            <span id="hud-boss-lock-text">3단계 잠금</span>
          </div>
          <div class="relative h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="hud-boss-hp-bar" class="h-full bg-gradient-to-r from-rose-600 via-orange-500 to-amber-400 transition-all duration-200" style="width: 100%"></div>
            <div class="absolute inset-y-0 left-1/3 w-0.5 bg-slate-950/80"></div>
            <div class="absolute inset-y-0 left-2/3 w-0.5 bg-slate-950/80"></div>
          </div>
        </div>

        <!-- 단일 네온 LED 전광판 카드 (좌: 세로 번개 3개, 중: 네온 영단어, 우: 일시정지) -->
        <div id="led-scoreboard" class="led-board pointer-events-auto mx-auto w-full rounded-2xl px-3.5 py-2 flex flex-col gap-1.5 cursor-pointer">
          <!-- 상단 메인 행: 좌(세로 번개 3개) · 중(네온 영단어) · 우(일시정지) -->
          <div class="flex items-center justify-between gap-2">
            <!-- 좌측: 세로 1열 번개 3개 스킬 인디케이터 -->
            <div id="hud-skill-sparks" class="flex flex-col items-center justify-center gap-0.5 px-1.5 py-1 rounded-xl bg-[#0b1a13]/90 border border-emerald-400/50 shadow-[0_0_8px_rgba(52,211,153,0.25)] shrink-0 transition-all duration-300">
              <span id="skill-spark-0" class="text-xs leading-none select-none transition-all duration-300 opacity-25 grayscale scale-95">⚡</span>
              <span id="skill-spark-1" class="text-xs leading-none select-none transition-all duration-300 opacity-25 grayscale scale-95">⚡</span>
              <span id="skill-spark-2" class="text-xs leading-none select-none transition-all duration-300 opacity-25 grayscale scale-95">⚡</span>
            </div>

            <!-- 중앙: 네온 영단어 문제 (터치 시 발음 재생) -->
            <div class="flex-1 flex items-center justify-center min-w-0 py-0.5 active:scale-95 transition-transform" title="터치하여 발음 듣기">
              <div id="led-word-text" class="neon-word-glow text-3xl sm:text-4xl font-extrabold tracking-wide leading-none text-[#f8f5ec] select-none truncate">
                READY
              </div>
            </div>

            <!-- 우측: 액션 버튼 (건너뛰기 및 일시정지) -->
            <div class="flex items-center gap-1.5 shrink-0 pointer-events-auto">
              <button id="btn-skip-tutorial" type="button" class="hidden px-2 h-7 rounded-lg bg-amber-500/20 border border-amber-400/50 text-[10px] font-extrabold text-amber-200 whitespace-nowrap active:scale-95">
                건너뛰기 ⏭
              </button>
              <button id="btn-pause" type="button" class="w-8 h-8 rounded-xl bg-[#1b3b2b] hover:bg-[#234735] border border-emerald-400/50 shadow-[0_0_8px_rgba(52,211,153,0.3)] flex items-center justify-center text-xs font-bold text-[#f8f5ec] active:scale-95">
                ⏸
              </button>
            </div>
          </div>
        </div>

        <!-- 대폭발 READY 더블 탭 펄스 알림 배지 -->
        <div id="hud-ult-ready-badge" class="hidden pointer-events-none mx-auto w-fit px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 text-white font-black text-xs tracking-wider shadow-[0_0_20px_rgba(245,158,11,0.85)] border-2 border-yellow-200 animate-bounce flex items-center gap-1.5">
          <span class="text-sm">💥</span>
          <span>화면 두 번 탭! (DOUBLE TAP)</span>
        </div>
      </div>
    </div>

    <!-- 3. 메인 로비 레이어 (LOBBY 상태) -->
    <div id="lobby-layer" class="relative z-10 flex flex-col h-full w-full bg-gradient-to-b from-[#efe9dc] via-[#f5f0e6] to-[#e6dec8]">
      <!-- 상단 재화 & 프로필 바 -->
      <header class="px-4 pt-[max(0.75rem,env(safe-area-inset-top))] pb-3 border-b border-[#142c20] bg-[#1b3b2b] text-[#f8f5ec] flex items-center justify-between gap-2 shadow-md">
        <div id="btn-header-profile" class="flex items-center gap-2.5 cursor-pointer active:scale-95 transition" title="프로필 & 설정">
          <div id="lobby-evo-badge" class="w-10 h-10 rounded-xl bg-[#234735] border border-[#2d5a43] flex items-center justify-center text-xl shadow-xs">🐶</div>
          <div>
            <div>
              <div class="text-xs font-extrabold text-[#f8f5ec]" id="lobby-player-title">우유</div>
              <div class="text-[11px] font-semibold text-emerald-300" id="lobby-evo-stage-name">네 발 아기 강아지 · A1</div>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 text-xs font-bold">
          <button id="btn-header-gold" type="button" title="훈련소로 이동" class="px-2.5 py-1 rounded-full bg-[#234735] hover:bg-[#2d5a43] border border-[#2d5a43] text-amber-300 flex items-center gap-1 shadow-xs cursor-pointer active:scale-95 transition">
            🪙 <span id="res-gold">0</span>
          </button>
          <button id="btn-header-snacks" type="button" title="훈련소로 이동" class="px-2.5 py-1 rounded-full bg-[#234735] hover:bg-[#2d5a43] border border-[#2d5a43] text-amber-200 flex items-center gap-1 shadow-xs cursor-pointer active:scale-95 transition">
            🦴 <span id="res-snacks">0</span>
          </button>
          <button id="btn-header-gems" type="button" title="상점으로 이동" class="px-2.5 py-1 rounded-full bg-[#234735] hover:bg-[#2d5a43] border border-[#2d5a43] text-cyan-300 flex items-center gap-1 shadow-xs cursor-pointer active:scale-95 transition">
            💎 <span id="res-gems">300</span>
          </button>
          <button id="btn-open-settings" type="button" class="w-8 h-8 rounded-full bg-[#234735] border border-[#2d5a43] text-[#f8f5ec] shadow-xs flex items-center justify-center text-sm active:scale-95" title="설정">⚙️</button>
        </div>
      </header>

      <!-- 로비 메인 콘텐츠 영역 (5개 탭 패널) -->
      <main id="lobby-content" class="flex-1 overflow-y-auto p-4 space-y-4">
        <section id="tab-panel-gear" class="hidden space-y-4"></section>
        <section id="tab-panel-battle" class="space-y-4"></section>
        <section id="tab-panel-training" class="hidden space-y-4"></section>
        <section id="tab-panel-shop" class="hidden space-y-4"></section>
        <section id="tab-panel-challenge" class="hidden space-y-4"></section>
      </main>

      <!-- 전투 탭 전용 하단 고정 출격 버튼 (플로팅) -->
      <div id="battle-cta-bar" class="px-4 py-2 pointer-events-auto">
        <button id="btn-start-battle" type="button" class="w-[180px] mx-auto block py-3 rounded-2xl bg-gradient-to-r from-[#2d6a4f] via-[#245840] to-[#1b4332] text-[#f8f5ec] font-black text-sm shadow-[0_6px_20px_rgba(45,106,79,0.35)] active:scale-95 transition">
          ⚔️ <span data-i18n="lobby.startBattle">전투 출격</span>
        </button>
      </div>

      <!-- 하단 5단 네비게이션 탭 -->
      <nav class="relative flex items-center justify-between border-t border-[#142c20] bg-[#1b3b2b] pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1.5 px-2 gap-1 shadow-[0_-4px_16px_rgba(20,44,32,0.35)]">
        <button type="button" data-lobby-tab="gear" class="lobby-tab-btn flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-lg leading-none">🎒</span>
          <span class="text-[10px] font-bold mt-1 whitespace-nowrap" data-i18n="lobby.tabGear">장비·코스튬</span>
        </button>
        <button type="button" data-lobby-tab="training" class="lobby-tab-btn flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-lg leading-none">🏋️</span>
          <span class="text-[10px] font-bold mt-1 whitespace-nowrap" data-i18n="lobby.tabTraining">훈련소</span>
        </button>
        <button type="button" data-lobby-tab="battle" class="lobby-tab-btn active flex-[1.25] -mt-3.5 flex flex-col items-center py-2 px-1 rounded-2xl bg-[#234735] border border-emerald-400/50 text-[#f8f5ec] shadow-[0_4px_12px_rgba(0,0,0,0.3)] transition">
          <span class="text-2xl leading-none">⚔️</span>
          <span class="text-[10px] font-black mt-1 whitespace-nowrap" data-i18n="lobby.tabBattle">전투</span>
        </button>
        <button type="button" data-lobby-tab="shop" class="lobby-tab-btn flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-lg leading-none">💎</span>
          <span class="text-[10px] font-bold mt-1 whitespace-nowrap" data-i18n="lobby.tabShop">상점</span>
        </button>
        <button type="button" data-lobby-tab="challenge" class="lobby-tab-btn flex-1 flex flex-col items-center py-1.5 px-1 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-lg leading-none">🏆</span>
          <span class="text-[10px] font-bold mt-1 whitespace-nowrap" data-i18n="lobby.tabChallenge">챌린지</span>
        </button>
      </nav>
    </div>

    <!-- 4. 공통 모달 & 팝업 오버레이 레이어 -->
    <div id="modal-layer" class="hidden absolute inset-0 z-40 bg-[#1f2d24]/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div id="modal-card" class="w-full max-w-[420px] max-h-[88dvh] overflow-y-auto bg-[#faf6ee] border border-[#d2c8b4] text-[#1f2d24] rounded-2xl p-5 shadow-2xl"></div>
    </div>

  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
