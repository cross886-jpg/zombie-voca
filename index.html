<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#070b14" />
  <title>영단어 특공대: 멍멍 수호대</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    /* 전역 스크롤바 시각적 숨김 (마우스 휠 및 터치 스크롤 정상 유지) */
    *,
    #lobby-content,
    #modal-card {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar,
    #lobby-content::-webkit-scrollbar,
    #modal-card::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body class="bg-[#e6dec8] text-[#1f2d24] flex items-center justify-center min-h-[100dvh] overflow-hidden">
  <!-- 9:16 모바일 세로 고정 뷰포트 (최대 480px) -->
  <div id="app-shell" class="relative w-full max-w-[480px] h-[100dvh] max-h-[920px] bg-[#efe9dc] overflow-hidden shadow-2xl border-x border-[#d2c8b4] flex flex-col">

    <!-- 1 & 2. 인게임 전투 Full 레이어 (PLAYING / PAUSED / BOSS 상태) -->
    <div id="hud-layer" class="hidden absolute inset-0 w-full h-full overflow-hidden z-20">
      <!-- 풀스크린 게임 캔버스 & 화살표 인디케이터 뷰포트 (화면 100% 채움) -->
      <div id="battle-viewport" class="absolute inset-0 w-full h-full overflow-hidden">
        <canvas id="game-canvas" class="absolute inset-0 w-full h-full block"></canvas>

        <!-- 상단 엣지 다크 페이드 비네팅 (전광판 위쪽 틈새 자연스러운 마감) -->
        <div class="absolute top-0 inset-x-0 h-16 pointer-events-none bg-gradient-to-b from-[#0a1811]/90 via-[#0a1811]/45 to-transparent z-10"></div>

        <!-- 4방향 네온 화살표 인디케이터 컨테이너 -->
        <div id="edge-arrows" class="absolute inset-0 pointer-events-none"></div>

        <!-- 오답 확인 브레이크 중앙 카드 오버레이 (1.2초) -->
        <div id="wrong-review-overlay" class="hidden absolute inset-0 z-30 bg-[#0a1811]/70 backdrop-blur-[2px] flex items-center justify-center p-5 pointer-events-none">
          <div class="w-full max-w-[290px] rounded-2xl bg-[#11261b]/95 border-2 border-amber-400/80 px-6 py-4 text-center shadow-[0_0_32px_rgba(245,158,11,0.45)] flex flex-col items-center justify-center">
            <div id="wrong-review-word" class="text-xl font-bold text-emerald-200/90 tracking-wider"></div>
            <div id="wrong-review-meaning" class="text-3xl sm:text-4xl font-extrabold text-amber-300 drop-shadow-[0_0_16px_rgba(251,191,36,0.65)] mt-1.5 leading-tight tracking-tight"></div>
          </div>
        </div>

        <!-- 플로팅 가상 조이스틱 (터치 시 동적 위치 이동) -->
        <div id="virtual-joystick" class="hidden fixed pointer-events-none z-30">
          <div id="joystick-base" class="w-24 h-24 rounded-full border-2 border-emerald-400/50 bg-emerald-500/10 backdrop-blur-[1px] flex items-center justify-center">
            <div id="joystick-knob" class="w-10 h-10 rounded-full bg-emerald-300/80 shadow-[0_0_12px_rgba(52,211,153,0.8)]"></div>
          </div>
        </div>
      </div>

      <!-- 상단 플로팅 오버레이: 단일 네온 LED 전광판 HUD (z-20) -->
      <div id="hud-top-frame" class="absolute top-1.5 inset-x-3 z-20 space-y-1.5 pointer-events-none pt-[env(safe-area-inset-top)]">
        <!-- 월반 테스트 상태 배지 (기본 숨김) -->
        <div id="hud-placement-badge" class="hidden pointer-events-auto mx-auto w-fit px-3.5 py-1 rounded-full bg-slate-950/95 border-2 border-indigo-500/80 text-white font-black text-xs shadow-[0_0_14px_rgba(99,102,241,0.5)] flex items-center justify-center gap-1.5">
          <span id="hud-placement-text">🎓 STAGE 월반 도전 · ❤️❤️❤️ (남은 기회 3회)</span>
        </div>

        <!-- 보스 체력 바 (28~30번 문제 전용, 기본 숨김) -->
        <div id="hud-boss-bar-wrap" class="hidden pointer-events-auto bg-slate-950/95 border-2 border-rose-500/80 rounded-xl px-3 py-1.5 backdrop-blur-sm shadow-[0_0_14px_rgba(244,63,94,0.4)]">
          <div class="flex items-center justify-between text-[11px] font-bold text-rose-300 mb-1">
            <span id="hud-boss-name">BOSS</span>
            <span id="hud-boss-lock-text">3단계 잠금</span>
          </div>
          <div class="relative h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="hud-boss-hp-bar" class="h-full bg-gradient-to-r from-rose-600 via-orange-500 to-amber-400 transition-all duration-200" style="width: 100%"></div>
            <div class="absolute inset-y-0 left-1/3 w-0.5 bg-slate-950/80"></div>
            <div class="absolute inset-y-0 left-2/3 w-0.5 bg-slate-950/80"></div>
          </div>
        </div>

        <!-- 상단 HUD 동일 높이 3분할 행 (좌: 세로형 슬림 필살기 게이지 바, 중: 순수 영단어 전광판, 우: 독립 일시정지) -->
        <div class="pointer-events-auto mx-auto w-full flex items-stretch gap-2 h-14">
          <!-- 좌측 블록: 세로형 슬림 필살기 충전 게이지 바 (아래에서 위로 황금/노란색 차오름) -->
          <div id="hud-left-widget" class="w-9 h-14 rounded-2xl bg-[#11261b]/95 border border-emerald-400/40 shadow-md shrink-0 flex flex-col items-center justify-between py-1.5 px-1.5 transition-all duration-300" title="필살기 에너지 게이지">
            <span id="hud-ult-vert-icon" class="text-[11px] leading-none select-none transition-transform duration-300">⚡</span>
            <div id="hud-ult-vert-track" class="relative w-2.5 flex-1 mt-1 rounded-full bg-[#07120c] border border-amber-400/45 overflow-hidden flex items-end">
              <div id="hud-ult-vert-fill" class="w-full bg-gradient-to-t from-amber-500 via-yellow-400 to-amber-200 rounded-full transition-all duration-200" style="height: 0%"></div>
            </div>
          </div>

          <!-- 중앙 블록: 순수 영어 단어 전용 전광판 (G, g, y, p, q, j 상하 잘림 방지 충분한 여백 및 사각형 음영 제거) -->
          <div id="led-scoreboard" class="flex-1 rounded-2xl bg-[#11261b]/95 border border-emerald-400/50 shadow-[0_0_12px_rgba(52,211,153,0.25)] flex items-center justify-center px-3 cursor-pointer select-none active:scale-95 transition-transform overflow-visible" title="터치하여 발음 듣기">
            <div id="led-word-text" class="neon-word-glow text-2xl sm:text-3xl font-extrabold tracking-wider leading-[1.3] text-[#f8f5ec] text-center truncate py-1">
              READY
            </div>
          </div>

          <!-- 우측 블록: 일시정지 독립 버튼 -->
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="btn-pause" type="button" class="w-14 h-14 rounded-2xl bg-[#11261b]/95 hover:bg-[#1b3b2b] border border-emerald-400/50 shadow-md flex items-center justify-center text-base font-bold text-[#f8f5ec] active:scale-95 transition cursor-pointer" title="일시정지">
              ⏸
            </button>
          </div>
        </div>

        <!-- Step 2 전용: 상단 전광판 아래쪽에서 전광판을 가리키는 큰 강아지 발바닥(🐾) 포인터 -->
        <div id="tutorial-scoreboard-pointer" class="hidden pointer-events-none mx-auto flex flex-col items-center pt-1">
          <div class="text-[48px] leading-none select-none tutorial-scoreboard-paw drop-shadow-[0_4px_12px_rgba(251,191,36,0.9)]">🐾</div>
          <span class="mt-1 px-2.5 py-0.5 rounded-full bg-amber-400 text-[#1f2d24] text-[11px] font-black shadow-md">▲ 목표 단어 확인!</span>
        </div>
      </div>

      <!-- 튜토리얼 하단 엄지 조작 구역 제스처 오버레이 (Step 1 8자 트랙 / Step 6 더블탭) -->
      <div id="tutorial-gesture-overlay" class="hidden absolute inset-x-0 bottom-[118px] pointer-events-none z-25 flex flex-col items-center justify-center">
        <!-- Step 1: 가로 8자(∞) 점선 트랙 + 큰 강아지 발바닥(🐾) 순환 애니메이션 -->
        <div id="tutorial-gesture-drag" class="hidden flex flex-col items-center gap-1.5">
          <div class="relative w-[220px] h-[88px] flex items-center justify-center">
            <svg viewBox="0 0 220 88" class="w-full h-full overflow-visible drop-shadow-[0_2px_10px_rgba(16,185,129,0.55)]">
              <path
                d="M 110 44 C 145 8, 204 8, 204 44 C 204 80, 145 80, 110 44 C 75 8, 16 8, 16 44 C 16 80, 75 80, 110 44 Z"
                fill="none"
                stroke="#6ee7b7"
                stroke-width="3.5"
                stroke-dasharray="7 6"
                stroke-linecap="round"
                opacity="0.88"
              />
            </svg>
            <span class="absolute left-1/2 top-1/2 text-[50px] leading-none select-none tutorial-infinity-paw drop-shadow-[0_4px_14px_rgba(52,211,153,0.95)]">🐾</span>
          </div>
          <span class="px-3 py-1 rounded-full bg-[#0a1811]/90 border border-emerald-400/70 text-emerald-200 text-xs font-black shadow-lg">드래그하여 이동</span>
        </div>

        <!-- Step 6: 큰 강아지 발바닥(🐾) 더블탭 + 파동(리플) 애니메이션 + "화면 두 번 터치! (더블탭)" 라벨 -->
        <div id="tutorial-gesture-doubletap" class="hidden flex flex-col items-center gap-1.5 mb-20">
          <span class="px-3.5 py-1 rounded-full bg-[#0a1811]/95 border-2 border-amber-300 text-amber-200 text-xs font-black shadow-[0_0_16px_rgba(251,191,36,0.8)] animate-bounce">화면 두 번 터치! (더블탭)</span>
          <div class="relative w-24 h-24 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-2 border-amber-400/90 bg-amber-400/20 tutorial-doubletap-ripple"></div>
            <div class="absolute inset-2 rounded-full border-2 border-orange-400/80 bg-orange-400/15 tutorial-doubletap-ripple-delay"></div>
            <span class="relative text-[52px] leading-none select-none tutorial-doubletap-paw drop-shadow-[0_4px_14px_rgba(251,191,36,0.95)]">🐾</span>
          </div>
        </div>
      </div>

      <!-- 필살기 100% 충전 시 하단 중앙 컴팩트 정사각형 필살기 발동 버튼 (기본 숨김, 튜토리얼 배너 유무에 따라 높이 자동 보정) -->
      <div id="hud-ult-action-wrap" class="hidden pointer-events-none absolute inset-x-0 bottom-6 z-30 flex justify-center transition-all duration-200">
        <button id="btn-hud-ult-cast" type="button" class="pointer-events-auto w-16 h-16 rounded-2xl bg-gradient-to-b from-amber-400 via-orange-500 to-rose-500 border-2 border-yellow-200 text-white shadow-[0_6px_20px_rgba(245,158,11,0.75)] flex flex-col items-center justify-center gap-0.5 active:scale-95 transition cursor-pointer tutorial-highlight-pulse">
          <span class="text-2xl leading-none drop-shadow-sm">⚡</span>
          <span id="hud-ult-btn-label" class="text-[10px] font-black leading-none tracking-tight drop-shadow-sm">필살기</span>
        </button>
      </div>
    </div>

    <!-- 3. 메인 로비 레이어 (LOBBY 상태) -->
    <div id="lobby-layer" class="relative z-10 flex flex-col h-full w-full overflow-hidden bg-gradient-to-b from-[#efe9dc] via-[#f5f0e6] to-[#e6dec8]">
      <!-- 상단 재화 & 프로필 바 -->
      <header class="px-4 pt-[max(0.75rem,env(safe-area-inset-top))] pb-3 border-b border-[#142c20] bg-[#1b3b2b] text-[#f8f5ec] flex items-center justify-between gap-2 shadow-md shrink-0">
        <!-- 1. 좌측 프로필 위젯 (모바일 RPG 스타일: 아바타 + CEFR 알약 배지 + 이름/레벨 게이지 바) -->
        <div id="btn-header-profile" class="flex items-center gap-2.5 cursor-pointer active:scale-95 transition select-none" title="모험가 프로필">
          <div class="relative shrink-0">
            <div id="lobby-evo-badge" class="w-10 h-10 rounded-xl bg-[#234735] border border-[#2d5a43] flex items-center justify-center text-xl shadow-xs">🐶</div>
          </div>
          <div class="flex flex-col justify-center gap-1 min-w-0">
            <div class="text-xs font-extrabold text-[#f8f5ec] truncate max-w-[70px]" id="lobby-player-title">우유</div>
            <button id="lobby-cert-badge" type="button" title="특공대 학습 코스 설정" class="self-start px-1.5 py-0.5 rounded-full bg-amber-500 border border-[#1b3b2b] text-[9px] font-black text-white leading-none whitespace-nowrap shadow-xs cursor-pointer active:scale-95 transition">🇺🇸 A1</button>
            <div class="w-full min-w-14 h-1.5 rounded-full bg-[#142c20] border border-[#2d5a43] overflow-hidden">
              <div id="lobby-header-xp-bar" class="h-full bg-gradient-to-r from-emerald-400 to-teal-300 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- 2. 우측 3대 재화 (금화 · 뼈다귀 · 보석) -->
        <div class="flex items-center gap-1.5 text-xs font-bold shrink-0">
          <button id="btn-header-gold" type="button" title="훈련소로 이동" class="px-2 py-1 rounded-full bg-[#234735] hover:bg-[#2d5a43] border border-[#2d5a43] text-amber-300 flex items-center gap-1 shadow-xs cursor-pointer active:scale-95 transition tabular-nums whitespace-nowrap">
            🪙 <span id="res-gold">0</span>
          </button>
          <button id="btn-header-snacks" type="button" title="훈련소로 이동" class="px-2 py-1 rounded-full bg-[#234735] hover:bg-[#2d5a43] border border-[#2d5a43] text-amber-200 flex items-center gap-1 shadow-xs cursor-pointer active:scale-95 transition tabular-nums whitespace-nowrap">
            🦴 <span id="res-snacks">0</span>
          </button>
          <button id="btn-header-gems" type="button" title="상점으로 이동" class="px-2 py-1 rounded-full bg-[#234735] hover:bg-[#2d5a43] border border-[#2d5a43] text-cyan-300 flex items-center gap-1 shadow-xs cursor-pointer active:scale-95 transition tabular-nums whitespace-nowrap">
            💎 <span id="res-gems">0</span>
          </button>
        </div>
      </header>

      <!-- 로비 메인 콘텐츠 영역 (5개 탭 패널) -->
      <main id="lobby-content" class="flex-1 overflow-hidden p-2 space-y-2">
        <section id="tab-panel-gear" class="hidden space-y-3 h-full overflow-y-auto"></section>
        <section id="tab-panel-training" class="hidden space-y-3 h-full overflow-y-auto"></section>
        <section id="tab-panel-battle" class="space-y-1.5 h-full flex flex-col justify-between overflow-hidden"></section>
        <section id="tab-panel-shop" class="hidden space-y-3 h-full overflow-y-auto"></section>
        <section id="tab-panel-compendium" class="hidden space-y-3 h-full overflow-y-auto"></section>
        <section id="tab-panel-journey" class="hidden space-y-3 h-full overflow-y-auto"></section>
      </main>

      <!-- 전투 탭 전용 하단 고정 출격 버튼 (플로팅) -->
      <div id="battle-cta-bar" class="px-3 py-1.5 pointer-events-auto shrink-0">
        <div class="grid grid-cols-2 gap-2 max-w-[340px] mx-auto">
          <button id="btn-start-battle" type="button" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-[#2d6a4f] via-[#245840] to-[#1b4332] text-[#f8f5ec] font-black text-xs sm:text-sm shadow-[0_6px_20px_rgba(45,106,79,0.35)] active:scale-95 transition flex items-center justify-center gap-1.5 cursor-pointer">
            <span>⚔️</span>
            <span data-i18n="lobby.startBattle">전투 출격</span>
          </button>
          <button id="btn-start-walk" type="button" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-amber-600 via-amber-500 to-amber-700 text-white font-black text-xs sm:text-sm shadow-[0_6px_20px_rgba(217,119,6,0.35)] active:scale-95 transition flex items-center justify-center gap-1.5 cursor-pointer">
            <span>🦮</span>
            <span>산책하기</span>
          </button>
        </div>
      </div>

      <!-- 하단 5단 네비게이션 탭 -->
      <nav class="relative flex items-center justify-between border-t border-[#142c20] bg-[#1b3b2b] pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1.5 px-2 gap-1.5 shadow-[0_-4px_16px_rgba(20,44,32,0.35)] shrink-0">
        <button type="button" data-lobby-tab="gear" class="lobby-tab-btn flex-1 flex flex-col items-center py-1 px-0.5 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-base leading-none">🐾</span>
          <span class="text-[9.5px] font-bold mt-1 whitespace-nowrap">우리 팀</span>
        </button>
        <button type="button" data-lobby-tab="training" class="lobby-tab-btn flex-1 flex flex-col items-center py-1 px-0.5 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-base leading-none">🏋️</span>
          <span class="text-[9.5px] font-bold mt-1 whitespace-nowrap" data-i18n="lobby.tabTraining">훈련</span>
        </button>
        <button type="button" data-lobby-tab="battle" class="lobby-tab-btn active flex-[1.2] -mt-3 flex flex-col items-center py-1.5 px-1 rounded-2xl bg-[#234735] border border-emerald-400/50 text-[#f8f5ec] shadow-[0_4px_12px_rgba(0,0,0,0.3)] transition">
          <span class="text-xl leading-none">⚔️</span>
          <span class="text-[10px] font-black mt-0.5 whitespace-nowrap" data-i18n="lobby.tabBattle">전투</span>
        </button>
        <button type="button" data-lobby-tab="shop" class="lobby-tab-btn flex-1 flex flex-col items-center py-1 px-0.5 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-base leading-none">💎</span>
          <span class="text-[9.5px] font-bold mt-1 whitespace-nowrap" data-i18n="lobby.tabShop">상점</span>
        </button>
        <button type="button" data-lobby-tab="compendium" class="lobby-tab-btn flex-1 flex flex-col items-center py-1 px-0.5 rounded-xl border border-transparent text-[#a3b899] hover:text-[#f8f5ec] transition">
          <span class="text-base leading-none">📖</span>
          <span class="text-[9.5px] font-bold mt-1 whitespace-nowrap">도감</span>
        </button>
      </nav>
    </div>

    <!-- 4. 공통 모달 & 팝업 오버레이 레이어 -->
    <div id="modal-layer" class="hidden absolute inset-0 z-40 bg-[#1f2d24]/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div id="modal-card" class="w-full max-w-[420px] max-h-[88dvh] overflow-y-auto bg-[#faf6ee] border border-[#d2c8b4] text-[#1f2d24] rounded-2xl p-5 shadow-2xl"></div>
    </div>

    <!-- 우유 교관 코칭 말풍선 배너 (전투 화면 맨 하단 고정, 스킬 선택 모달보다 높은 z-50 노출) -->
    <div id="hud-tutorial-coach" class="hidden pointer-events-auto fixed bottom-4 inset-x-3 max-w-[456px] mx-auto z-50 rounded-2xl bg-[#faf6ee]/95 border-2 border-amber-400 shadow-[0_6px_24px_rgba(0,0,0,0.45),0_0_20px_rgba(245,158,11,0.35)] px-3.5 py-2.5 flex flex-col gap-2 transition-all duration-200" style="bottom: 16px; top: auto;">
      <div class="flex items-center gap-2.5 w-full">
        <div class="relative shrink-0">
          <div class="w-11 h-11 rounded-xl bg-white border-2 border-amber-400 shadow-xs flex flex-col items-center justify-center leading-none">
            <span class="text-xl leading-none">🐶</span>
            <span class="text-[8px] font-black text-amber-800 mt-0.5">우유 교관</span>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-1.5">
            <span id="tutorial-coach-step" class="text-[10px] font-black text-amber-800 bg-amber-200/80 px-1.5 py-0.5 rounded-full leading-none">STEP 1 / 6</span>

      </div>
      <button id="btn-tutorial-coach-ack" type="button" class="hidden w-full max-w-[220px] mx-auto py-2.5 px-6 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 border-2 border-yellow-200 ring-2 ring-amber-300/80 text-white font-black text-xs shadow-[0_0_16px_rgba(251,191,36,0.9)] active:scale-95 transition cursor-pointer text-center whitespace-nowrap tutorial-highlight-pulse">

      <div id="lobby-tour-spotlight" class="pointer-events-none" style="position: fixed; border: 3px solid #fbbf24; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.78); pointer-events: none; z-index: 9991;"></div>

        <div class="relative shrink-0">

          <div class="flex items-center justify-between gap-1.5">

          </div>
          <p id="lobby-tour-text" class="text-xs font-extrabold text-[#1f2d24] mt-1 leading-snug break-keep">

          </p>
        </div>
        <button id="btn-lobby-tour-action" type="button" class="hidden shrink-0 px-3.5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-xs shadow-md active:scale-95 transition cursor-pointer whitespace-nowrap tutorial-highlight-pulse">
          다음으로 🐾
        </button>
      </div>
    </div>

  </div>
